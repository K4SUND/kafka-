spring.application.name=consumer

spring.kafka.consumer.bootstrap-servers= localhost:9092
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# use the local class, ignore the producer's type header
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.consumer.dto.CreditCard
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# consumer group
spring.kafka.consumer.group-id= creditCard

# port
server.port= 8081